name: Mobile Tablet Back Navigation (NO DEPLOY)
on:
  push:
    branches:
      - feature/mobile-tablet-back-navigation-20261012
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check navigation integration
        run: |
          grep -Fq '<MobileBackBar />' frontend/src/components/layout/AppShell.tsx
          grep -Fq '>Quay lại</span>' frontend/src/components/layout/AppShell.tsx
          grep -Fq 'navigate(-1)' frontend/src/components/navigation/MobileBackBar.tsx
          grep -Fq 'max-width: 1024px' frontend/src/components/navigation/mobile-back.css
