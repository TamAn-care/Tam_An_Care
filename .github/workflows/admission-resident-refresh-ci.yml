name: Admission Resident Refresh CI
on:
  push:
    branches: [fix/admission-resident-sync-20261013]
  pull_request:
    paths:
      - 'frontend/src/api/admissions.ts'
      - 'frontend/src/features/admissions/AdmissionPage.tsx'
      - '.github/workflows/admission-resident-refresh-ci.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Pending backend resident synchronization evidence
        if: always()
        run: |
          echo "COMMIT_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "SERVER_RESIDENT_PERSISTENCE_SYNC=NOT_IMPLEMENTED" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_DECISION=NO_GO" >> "$GITHUB_STEP_SUMMARY"
