name: Guardian Auth Verification

on:
  pull_request:
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'docs/guardian-auth/**'
      - 'scripts/guardian-ci/**'
      - '.github/workflows/guardian-auth-verification.yml'
  push:
    branches:
      - feature/guardian-resident-scope-auth-20261012
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'docs/guardian-auth/**'
      - 'scripts/guardian-ci/**'
      - '.github/workflows/guardian-auth-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: API locked build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Build NestJS API
        run: npm run build
      - name: Force complete TypeScript emission for isolated security tests
        run: npx tsc --project tsconfig.json --incremental false
      - name: Verify compiled auth test targets exist (fail closed)
        run: |
          set -euo pipefail
          for file in dist/security/production-auth.middleware.js dist/resident-access-scope/resident-access-scope.service.js dist/residents/resident.controller.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Compiled test target missing: $file"
              find dist -maxdepth 5 -type f -name '*.js' | head -80 || true
              exit 1
            fi
          done
      - name: Staff authentication middleware regression (isolated)
        run: node --test test/guardian-auth-middleware.test.cjs
      - name: Resident scope regression (isolated)
        run: node --test test/resident-access-scope.test.cjs
      - name: Resident controller server-side authorization (isolated)
        run: node --test test/resident-controller-authorization.test.cjs

  build-frontend:
    name: Frontend locked build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Vite frontend
        run: npm run build

  auth-release-gate:
    name: Guardian 22-case release gate (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate acceptance matrix and executable test evidence
        run: python3 scripts/guardian-ci/verify_release_gate.py

  automation-summary:
    name: Automated Guardian CI readiness report
    if: always()
    needs:
      - build-api
      - build-frontend
      - auth-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish consolidated CI result and release blockers
        shell: bash
        env:
          API_RESULT: ${{ needs.build-api.result }}
          FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          RELEASE_GATE_RESULT: ${{ needs.auth-release-gate.result }}
        run: |
          set -euo pipefail
          {
            echo '## Tâm An Care — Guardian CI automation'
            echo
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| API build and isolated Staff/Scope tests | $API_RESULT |"
            echo "| Frontend build | $FRONTEND_RESULT |"
            echo "| 22-case executable release gate | $RELEASE_GATE_RESULT |"
            echo
            echo '### Release decision'
            echo 'PRODUCTION_GO_NO_GO=NO_GO'
            echo
            echo 'Release is blocked until the 22 mapped authorization cases have executed,'
            echo 'canonical source/build provenance has been confirmed, and a separate'
            echo 'deployment approval is recorded. A build PASS alone is insufficient.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'AUTOMATION_SUMMARY=RECORDED\n'
          printf 'PRODUCTION_GO_NO_GO=NO_GO\n'
