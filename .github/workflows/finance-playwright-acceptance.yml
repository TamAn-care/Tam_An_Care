name: Finance Playwright Acceptance — NO DEPLOY

on:
  push:
    branches:
      - feature/finance-github-first-transition-*
  pull_request:
    branches:
      - feature/finance-v381861-isolated-integration
    paths:
      - 'api/src/auth/**'
      - 'api/src/database/**'
      - 'api/src/finance-billing/**'
      - 'api/src/security/**'
      - 'frontend/**'
      - 'ops/ci/finance-playwright-*'
      - 'ops/ci/run-finance-playwright-e2e.sh'
      - 'ops/finance/v32/009_service_price_catalog.sql'
      - '.github/workflows/finance-playwright-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: synthetic_only_finance_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGUSER: finance_ci
      PGPASSWORD: synthetic_only_finance_ci
      PGHOST: 127.0.0.1
      PGPORT: 5432
      FINANCE_E2E_PASSWORD: synthetic_only_finance_e2e_password
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert candidate SHA and no production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${DATABASE_URL:-}"
          test -z "${DATABASE_URL_FILE:-}"
          echo "FINANCE_PLAYWRIGHT_SHA=$GITHUB_SHA"
          echo 'PRODUCTION_DATABASE_CONFIG=ABSENT'
          echo 'PRODUCTION_DEPLOY=NO'
      - name: Generate redacted candidate provenance manifest
        shell: bash
        run: node ops/ci/finance-ci-provenance.cjs frontend/finance-artifacts/candidate-provenance.json
      - name: Build actual Finance API and run Chromium acceptance on disposable PostgreSQL 16
        shell: bash
        run: bash ops/ci/run-finance-playwright-e2e.sh
      - name: Upload candidate provenance, Playwright report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-playwright-${{ github.sha }}-${{ github.run_id }}
          path: |
            frontend/finance-artifacts/
            frontend/test-results/finance/
          if-no-files-found: error
          retention-days: 7
