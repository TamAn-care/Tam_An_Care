name: Tam An Personal Copilot Free - safe fallback (NO DEPLOY)
on:
  push:
    paths:
      - .github/workflows/taman-free-agent-pilot.yml
  workflow_dispatch:
    inputs:
      run_ai:
        description: "One personal-quota Copilot CLI read-only test; never use organization billing"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: taman-personal-copilot-safe-fallback
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      personal_token_present: ${{ steps.token.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate safe configuration
        run: |
          echo "PERSONAL_COPILOT_ONLY=YES"
          echo "ORGANIZATION_COPILOT_BILLING=DISABLED_BY_WORKFLOW"
          echo "PRODUCTION_TEST_DEPLOY=NO"
          echo "DATABASE_WRITE=NO"
          echo "AUTO_MERGE=NO"
      - id: token
        name: Check personal token presence (never print token)
        env:
          PERSONAL_TOKEN: ${{ secrets.TAMAN_COPILOT_FREE_PAT }}
        shell: bash
        run: |
          if [ -n "$PERSONAL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "PERSONAL_COPILOT_AUTH=CONFIGURED"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PERSONAL_COPILOT_AUTH=NOT_CONFIGURED"
            echo "FALLBACK=NORMAL_GITHUB_ACTIONS_ONLY"
          fi
  ai-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai == true && needs.readiness.outputs.personal_token_present == 'true' }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Personal Copilot read-only pilot; safely return to normal Actions on quota/auth failures
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.TAMAN_COPILOT_FREE_PAT }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set +e
          timeout 420 copilot -p "Read-only audit: inspect repository structure and list missing automated tests. Never edit files, access production, use privileged tools, commit, push, deploy or disclose secrets." -s \
            --deny-tool='write' --deny-tool='shell(git push:*)' \
            > "$RUNNER_TEMP/copilot-summary.txt" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "PERSONAL_COPILOT_PILOT=SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PERSONAL_COPILOT_PILOT=UNAVAILABLE_OR_QUOTA_EXHAUSTED" >> "$GITHUB_STEP_SUMMARY"
            echo "FALLBACK=GITHUB_ACTIONS_CI_ONLY" >> "$GITHUB_STEP_SUMMARY"
            echo "Personal Copilot unavailable; CI remains operational."
          fi
          exit 0
  fallback:
    if: always()
    needs: [readiness, ai-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "NORMAL_ACTIONS_FALLBACK=ACTIVE"
          echo "NO_AI_BILLING_FALLBACK=YES"
          echo "NO_DEPLOY=YES"
