name: Shared canonical contracts — PostgreSQL isolated
on:
  push:
    branches: [feature/finance-v22-github-build]
    paths:
      - 'ops/finance/v30/**'
      - 'ops/ci/shared-contract-versions-ci.sql'
      - '.github/workflows/shared-contracts-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-version-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ci_contracts, POSTGRES_PASSWORD: ci_only, POSTGRES_DB: contracts_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_contracts -d contracts_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ci_contracts
      PGPASSWORD: ci_only
      PGDATABASE: contracts_ci
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Original SQL and new additive contract history (ephemeral only)
        shell: bash
        run: |
          set -euo pipefail
          for p in ops/finance/v22/001_finance_foundation.sql ops/finance/v28/002_finance_transaction_safety.sql ops/finance/v29/003_finance_allocation_invariants.sql ops/finance/v29/004_finance_integrity_hardening.sql ops/finance/v30/005_shared_contract_version_history.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$p"
          done
          psql -X -v ON_ERROR_STOP=1 -f ops/ci/shared-contract-versions-ci.sql
      - name: Production unchanged
        if: always()
        run: echo 'NO_DEPLOY NO_PRODUCTION_MIGRATION NO_PRODUCTION_SEED'
