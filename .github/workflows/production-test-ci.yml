name: Production Test CI

on:
  push:
    branches:
      - antigravity-production-test
      - 'ag/**'
  pull_request:
    branches:
      - main
      - antigravity-production-test

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  api-build:
    name: API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Test resident meal RBAC (fail-closed)
        run: node --test test/resident-meal-registration.policy.test.cjs

      - name: Test production JWT middleware over HTTP (isolated)
        run: node --test test/resident-meal-auth-http.test.cjs

  resident-meal-schema-check:
    name: Resident meal schema / rollback (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_meal
          POSTGRES_PASSWORD: ci_only_not_production
          POSTGRES_DB: ci_meal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_meal -d ci_meal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ci_meal
      PGPASSWORD: ci_only_not_production
      PGDATABASE: ci_meal
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated FK prerequisite only (no business data)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE residents (resident_id TEXT PRIMARY KEY);
          SQL
      - name: Apply candidate migration then ROLLBACK (no persistent changes)
        run: |
          {
            echo 'BEGIN;'
            cat database/migrations/20261009_017_resident_meal_registrations.sql
            echo "DO \$\$ BEGIN IF to_regclass('public.resident_meal_registrations') IS NULL OR to_regclass('public.resident_meal_registration_audit') IS NULL THEN RAISE EXCEPTION 'Meal registration tables missing'; END IF; END \$\$;"
            echo 'ROLLBACK;'
          } | psql -v ON_ERROR_STOP=1
      - name: Verify migration was completely rolled back
        run: |
          test "$(psql -Atc "SELECT to_regclass('public.resident_meal_registrations') IS NULL AND to_regclass('public.resident_meal_registration_audit') IS NULL")" = "t"

  resident-meal-integration:
    name: Resident meal CRUD and security (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_meal
          POSTGRES_PASSWORD: ci_only_not_production
          POSTGRES_DB: ci_meal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_meal -d ci_meal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ci_meal
      PGPASSWORD: ci_only_not_production
      PGDATABASE: ci_meal
      TEST_MEAL_DATABASE_URL: postgresql://ci_meal:ci_only_not_production@localhost:5432/ci_meal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Prepare disposable schema and domain registration tables
        run: |
          psql -v ON_ERROR_STOP=1 -f ops/ci/resident-meal-isolated-prerequisites.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/20261009_017_resident_meal_registrations.sql
      - name: Install backend dependencies
        working-directory: api
        run: npm ci
      - name: Build backend
        working-directory: api
        run: npm run build
      - name: Exercise real PostgreSQL CRUD, audit, totals and denied roles
        working-directory: api
        run: node --test test/resident-meal-registration.integration.test.cjs
