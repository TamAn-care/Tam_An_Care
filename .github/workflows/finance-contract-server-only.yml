name: Finance Contracts Server-Only CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'ops/ci/contract-*.cjs'
      - 'ops/finance/**'
      - '.github/workflows/finance-contract-server-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      - name: Block browser contract persistence
        run: node ops/ci/contract-server-only-check.cjs
      - name: Check quarantine policy
        run: node ops/ci/contract-quarantine-safety.cjs
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install API dependencies
        run: npm --prefix api ci --no-audit --no-fund
      - name: Build API
        run: npm --prefix api run build
