name: Contract self-hosted runner — RETIRED (no jobs)
# Retired by operator decision: GitHub-hosted + Controlled Pull Deployment.
# Intentionally no workflow_dispatch, push, schedule, jobs or runner labels.
on:
  workflow_dispatch:
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'SELF_HOSTED_RUNNER_PLAN_RETIRED'
