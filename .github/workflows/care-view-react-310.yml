name: Care View React 310 regression build (NO DEPLOY)
on:
  push:
    branches:
      - fix/care-view-react-310-20261012
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/care-view-react-310.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
