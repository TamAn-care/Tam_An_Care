name: Tâm An CI event-driven coordinator (NO DEPLOY)
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Care View Specialist Security Gate (NO DEPLOY)"
      - "Admission DOB correction audit (NO DEPLOY)"
      - "Resident record code foundation (NO DEPLOY)"
      - "Guardian Auth Verification"
      - "Guardian Auth — Build Verification"
      - "Finance GitHub-first qualification — NO DEPLOY"
      - "Tam An Care Dashboard V2.1"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ci-coordinator
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snapshot PR heads and CI results without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base=f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
          token=os.environ['GH_TOKEN']
          def get(path):
              req=urllib.request.Request(base+path,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'tam-an-ci-coordinator'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          rows=[]
          for number in (24,23,22,6,5):
              try:
                  pr=get(f'/pulls/{number}')
                  sha=pr['head']['sha']
                  checks=get(f'/commits/{sha}/check-runs?per_page=100')
                  runs=[x for x in checks.get('check_runs',[])
                        if x.get('name') and x.get('status')]
                  failed=[x['name'] for x in runs
                          if x.get('conclusion') in ('failure','timed_out','action_required')]
                  pending=[x['name'] for x in runs if x['status']!='completed']
                  status=('BLOCKED' if failed else 'PENDING' if pending else
                          'CHECKS_REPORTED' if runs else 'NO_CHECK_RUNS')
                  rows.append((number,sha[:12],status,len(runs),len(failed)))
              except Exception as ex:
                  rows.append((number,'unverified','CHECK_ERROR',0,0))
                  print(f'WARN PR {number}: {type(ex).__name__}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Tam An CI event-driven snapshot (non-deploy)\n\n')
              f.write('| PR | SHA | Status | Checks | Failed |\n|---|---|---|---:|---:|\n')
              for number,sha,status,total,failed_count in rows:
                  f.write(f'| #{number} | \`{sha}\` | {status} | {total} | {failed_count} |\n')
              f.write('\nSnapshot is observational, not release approval or automated code repair.\n')
          print('CI_COORDINATOR_SNAPSHOT=PASS')
          print('DATABASE_WRITE=NO; DEPLOY=NO; MERGE=NO')
          PY
