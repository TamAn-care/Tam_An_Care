name: Finance V61 isolated merge candidate — NO DEPLOY
on:
  push:
    branches: [feature/finance-v381861-isolated-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: finance_ci_only
          POSTGRES_DB: finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Three-way integration in disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin antigravity-production-test
          BASE_SHA="$(git rev-parse origin/antigravity-production-test)"
          FIN_SHA="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/v61"
          printf 'BASE_SHA=%s\nFIN_SHA=%s\n' "$BASE_SHA" "$FIN_SHA" > "$RUNNER_TEMP/v61/evidence.txt"
          git -c user.name='CI Finance' -c user.email='finance-ci@localhost' switch --detach "$BASE_SHA"
          if git -c user.name='CI Finance' -c user.email='finance-ci@localhost' merge --no-commit --no-ff "$FIN_SHA"; then
            echo 'THREE_WAY_MERGE=CLEAN' | tee -a "$RUNNER_TEMP/v61/evidence.txt"
            git diff --cached --name-only > "$RUNNER_TEMP/v61/integrated-paths.txt"
            if [[ ! -f api/src/finance-billing/finance-read.controller.ts || ! -f frontend/src/features/finance/MonthlyOperatingResultPanel.tsx ]]; then
              echo 'MISSING_CANONICAL_FINANCE=YES' | tee -a "$RUNNER_TEMP/v61/evidence.txt"
              exit 1
            fi
            echo 'INTEGRATION_SCOPE=GITHUB_ONLY' >> "$RUNNER_TEMP/v61/evidence.txt"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/v61/conflicts.txt"
            cat "$RUNNER_TEMP/v61/conflicts.txt"
            if [[ "$(wc -l < "$RUNNER_TEMP/v61/conflicts.txt")" -eq 1 ]] &&
               grep -Fxq 'api/src/app.module.ts' "$RUNNER_TEMP/v61/conflicts.txt"; then
              echo 'V62_SINGLE_CONFLICT=APP_MODULE' | tee -a "$RUNNER_TEMP/v61/evidence.txt"
              git show "$FIN_SHA:api/src/app.module.ts" > api/src/app.module.ts
              node -e 'const s=require("node:fs").readFileSync("api/src/app.module.ts","utf8");for(const n of ["PaperRecordModule","FinanceReadController","FinanceWriteController","FinanceBillingService","MonthlyOperatingResultService","CanonicalServiceContractsController","CanonicalContractDraftController","ContractSignoffController"]){if(!s.includes(n))throw Error("V62_REQUIRED_MODULE_MISSING:"+n)}if(!s.includes("    PaperRecordModule,"))throw Error("V62_PAPER_RECORD_NOT_REGISTERED");console.log("V62_MODULE_PRESERVATION_PASS")'
              git add api/src/app.module.ts
              test -z "$(git diff --name-only --diff-filter=U)"
              echo 'THREE_WAY_MERGE=CONTROLLED_APP_MODULE_RESOLUTION' | tee -a "$RUNNER_TEMP/v61/evidence.txt"
              git diff --cached --name-only > "$RUNNER_TEMP/v61/integrated-paths.txt"
            else
              echo 'THREE_WAY_MERGE=UNRESOLVED_CONFLICTS' | tee -a "$RUNNER_TEMP/v61/evidence.txt"
              exit 1
            fi
          fi
      - name: Isolated API and frontend builds
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ( cd api && npm ci --ignore-scripts --no-audit --no-fund && npm run build )
          ( cd frontend && npm ci --ignore-scripts --no-audit --no-fund && ./node_modules/.bin/tsc -p tsconfig.node.json --noEmit && ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit && ./node_modules/.bin/vite build )
          echo 'MERGED_BUILD=PASS' >> "$RUNNER_TEMP/v61/evidence.txt"
      - name: V63 Finance and preserved-module regression suite
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f api/src/paper-records/paper-record.module.ts
          test -f api/src/finance-billing/finance-read.controller.ts
          test -f api/src/finance-billing/monthly-operating-result.service.ts
          test -f frontend/src/features/finance/MonthlyOperatingResultPanel.tsx
          node -e 'const fs=require("node:fs");const s=fs.readFileSync("api/src/app.module.ts","utf8");for(const n of ["PaperRecordModule","FinanceReadController","FinanceWriteController","MonthlyOperatingResultService","FinanceBillingService"]){if(!s.includes(n))throw Error("V63_REQUIRED_REGISTRATION_MISSING:"+n)}console.log("V63_MODULE_REGRESSION_PASS")'
          node ops/ci/finance-v3813-read-only-reconciliation-test.cjs
          echo 'V63_FINANCE_REGRESSION=PASS' >> "$RUNNER_TEMP/v61/evidence.txt"
      - name: V64 isolated JWT RBAC and controller smoke
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node ops/ci/finance-http-jwt-isolated-test.cjs
          node ops/ci/finance-nest-http-jwt-test.cjs
          echo 'V64_JWT_RBAC=PASS' >> "$RUNNER_TEMP/v61/evidence.txt"
      - name: V64 isolated PostgreSQL allocation and concurrency invariants
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '192\\.168\\.1\\.32|tamancare\\.dpdns\\.org|production-postgres' ops/ci/finance-pg-lab-{schema.sql,tests.sql,run.sh}
          bash ops/ci/finance-pg-lab-run.sh
          echo 'V64_POSTGRES_ISOLATED=PASS' >> "$RUNNER_TEMP/v61/evidence.txt"
      - name: Publish diagnostic evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-v61-isolated-merge-evidence
          path: ${{ runner.temp }}/v61/
          retention-days: 14
      - name: Explicit release restriction
        if: success()
        run: |
          echo 'RESULT=TAMANCARE_FINANCE_V381861_ISOLATED_GITHUB_MERGE_BUILD_PASS'
          echo 'PRODUCTION_RUNTIME_PARITY=NOT_PROVEN'
          echo 'ANTIGRAVITY_DIRTY_WORKTREE_PRESERVED=NOT_TOUCHED'
          echo 'MIGRATION=NO SEED=NO DEPLOY=NO'
          echo 'PRODUCTION_GO_NO_GO=NO_GO'
