services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: taman
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: taman_care

    secrets:
      - postgres_password

    volumes:
      - tamancare_production_test_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U taman -d taman_care
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./api

    restart: unless-stopped

    env_file:
      - ./api/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL_FILE: /run/secrets/database_url

    secrets:
      - database_url

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "3000"


  frontend:
    build:
      context: .
      dockerfile: production-test/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "8080:80"


volumes:
  tamancare_production_test_db:

secrets:
  postgres_password:
    file: "${TAMANCARE_POSTGRES_PASSWORD_FILE:?Set TAMANCARE_POSTGRES_PASSWORD_FILE to a protected secret file}"
  database_url:
    file: "${TAMANCARE_DATABASE_URL_FILE:?Set TAMANCARE_DATABASE_URL_FILE to a protected secret file}"
