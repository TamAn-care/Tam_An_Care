server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================================
    # API
    # ==============================================================
    
    # TAMANCARE_DOUBLE_API_SAFETY_NET
    # Defensive compatibility layer:
    # /api/api/x -> /api/x
    #
    # Primary prevention happens at frontend build time.
    # This exists only so an accidental legacy frontend
    # cannot lock users out of Production Test.
    location ^~ /api/api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;

        proxy_pass http://api:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-TamanCare-Api-Path-Normalized "1" always;
    }

location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================
    # VITE BUILD ASSETS
    #
    # Missing JS/CSS must be a real 404.
    # Never fall back to SPA index.html.
    # ==============================================================
    location ^~ /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
    }

    # ==============================================================
    # SERVICE WORKER
    # ==============================================================
    location = /sw.js {
        try_files $uri =404;

        default_type application/javascript;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ==============================================================
    # SPA ENTRYPOINT
    # ==============================================================
    location = /index.html {
        try_files $uri =404;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ==============================================================
    # MANIFEST
    # ==============================================================
    location = /manifest.json {
        try_files $uri =404;

        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ==============================================================
    # STATIC FILES
    # ==============================================================
    location ^~ /branding/ {
        try_files $uri =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
    }

    location = /favicon.png {
        try_files $uri =404;
    }

    # ==============================================================
    # REACT SPA ROUTES ONLY
    # ==============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
