services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taman
      POSTGRES_PASSWORD: taman_dev_password
      POSTGRES_DB: taman_care
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
  api:
    build: ./api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://taman:taman_dev_password@postgres:5432/taman_care
      JWT_SECRET: change-this-development-secret-with-more-than-32-chars-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - postgres
volumes:
  postgres_data:
